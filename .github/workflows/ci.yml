name: Kotlin

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  starter:
    name: Starter compilation
    if: github.repository == 'nikitosion/kfd-indexing-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean testClasses --console=plain

  solution:
    name: Solution tests
    if: github.repository != 'nikitosion/kfd-indexing-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --console=plain
